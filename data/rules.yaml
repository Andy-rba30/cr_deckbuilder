# Reglas de construcción de mazos.
deck:
  size: 8
  evo_slots: 2              # espacios de evolución por mazo (cámbialo si Supercell cambia los slots)
  max_champions: 1
  avg_elixir: [2.6, 4.3]    # rango permitido del promedio de elixir
  role_limits:              # RESTRICCIONES DURAS por mazo
    win_condition: {min: 1, max: 2}
    air_defense:   {min: 2}
    tank:          {max: 1}
    building:      {max: 2}
  spell_roles: [small_spell, big_spell]
  min_spells: 1
  max_spells: 3

# RESTRICCIONES SUAVES: suman puntos si el mazo tiene al menos una carta con alguno de esos roles
role_bonuses:
  - {name: "Hechizo ligero",        any_roles: [small_spell],                          bonus: 0.25}
  - {name: "Hechizo fuerte",        any_roles: [big_spell],                            bonus: 0.15}
  - {name: "Ancla defensiva",       any_roles: [building, mini_tank, anti_tank_dps],   bonus: 0.20}
  - {name: "Respuesta a tanques",   any_roles: [anti_tank_dps, building],              bonus: 0.20}
  - {name: "Daño en área",          any_roles: [splash],                               bonus: 0.20}
  - {name: "Carta de ciclo barata", any_roles: [cycle],                                bonus: 0.10}

level:
  curve: 0.45                  # qué tan rápido castiga la diferencia de nivel
  over_bonus_per_level: 0.03   # bonus por estar SOBRE el nivel de referencia
  over_bonus_cap: 2            # máximo de niveles que suman bonus
  breakpoint_penalty: 0.15     # castigo por cada punto de quiebre perdido

evo_bonus_default: 0.25        # si la API dice que tienes la evolución pero el catálogo no tiene bonus
champion_bonus: 0.05
unknown_card: {meta: 0.40, sens: 0.50}   # cartas nuevas que aún no están en cards.yaml

# META CON BATALLAS REALES (pestaña 📊 Meta o: python cli.py --tag "#TU_TAG" --mode meta)
# Solo se usa si existe data/battles.json. Puedes cambiar estos valores sin volver a descargar.
battle_meta:
  battle_types: [PvP, pathOfLegend, riverRacePvP]   # tipos de batalla 1 contra 1 que cuentan
  max_age_days: 28          # ignora batallas más antiguas (el balance cambia cada mes)
  ridge: 10                 # prudencia de la regresión: más alto = efectos más pequeños con pocos datos
  popularity_weight: 0.3    # 0 = solo win rate, 1 = solo popularidad, para ordenar las cartas
  prior_games: 100          # con esta cantidad de partidas, el dato pesa igual que cards.yaml
  synergy:
    min_together: 5         # partidas mínimas de una carta (y de un par) para medir sinergias
    smoothing: 5            # suaviza el lift de pares con pocos mazos
    cooc_scale: 0.015       # peso por cada vez que se DUPLICA lo esperado de jugarse juntas
    win_prior: 100          # prudencia con el win rate de un par (mazos "imaginarios" al 50%)
    win_scale: 1.0          # peso por punto de win rate extra al ir juntas (0.03 → +0.03)
    clip: [-0.25, 0.10]     # límites del peso de un par
    min_weight: 0.02        # ignora pares con peso menor que esto
    max_pairs: 300          # máximo de pares de datos que se usan

# BONUS POR CARTAS QUE YA JUEGAS (las sabes usar). Sale de tus últimas batallas y de tu mazo actual.
comfort:
  weight: 0.10          # bonus de una carta que usas en el 100% de tus batallas (0 = sin bonus)
  current_deck: 0.6     # las cartas de tu mazo equipado cuentan como usadas al menos en este % (0 a 1)
