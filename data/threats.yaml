# Amenazas típicas y qué tan bien responde cada carta (0 = nada, 1 = respuesta sólida).
#   roles: valor por rol de la carta (se toma el más alto de sus roles)
#   cards: valor exacto para cartas concretas (manda sobre los roles)
#   need:  suma de respuestas para cubrir la amenaza al 100% (2 = quieres dos respuestas sólidas,
#          para tener otra si la primera no está en mano)
# Cobertura de un mazo = suma de las respuestas de sus cartas / need (como máximo 100%).
#
# IMPORTANTE: son ESTIMACIONES INICIALES, como las de cards.yaml. Ajústalas a tu criterio.
weight: 0.15        # puntaje extra por cada amenaza cubierta al 100%
warn_below: 0.5     # avisa si un mazo cubre una amenaza menos que esto
threats:
