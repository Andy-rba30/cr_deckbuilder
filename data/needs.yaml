# Cómo se complementan las cartas: cada carta tiene NECESIDADES (defectos que otra carta debe
# cubrir, o algo que la potencia) y otras cartas las CUBREN.
#
#   cards:          quién lo necesita y cuánto (0..1)
#   card_roles:     lo mismo, por rol (si la carta no está en cards:)
#   providers:      quién lo cubre y cuánto (0..1)
#   provider_roles: lo mismo, por rol (si la carta no está en providers:)
#   need:           suma de cobertura para cubrirlo al 100% (por defecto 1)
#   good / bad:     textos para explicar el mazo ({p} = quien cubre, {c} = quien lo necesita)
#
# Una carta nunca se cubre a sí misma. En el puntaje, cada necesidad cuenta desde −50% (nada la
# cubre) hasta +50% (cubierta del todo) de weight × necesidad: así una carta "exigente" vale menos
# sola y más bien acompañada, sin reglas fijas de qué va con qué.
#
# IMPORTANTE: son ESTIMACIONES INICIALES, como las de cards.yaml. Ajústalas a tu criterio.
weight: 0.20
warn_below: 0.5     # avisa si una necesidad importante (≥ 0.5) queda cubierta menos que esto
