# Catálogo de cartas: metadatos que la API de Supercell NO entrega.
# La clave `name` es el nombre en INGLÉS tal como lo devuelve la API.
#
#   es:     nombre para mostrar
#   elixir: costo (si la API lo trae, se usa el de la API)
#   roles:  funciones de la carta (ver lista en README)
#   sens:   dependencia de nivel, 0 = funciona a cualquier nivel, 1 = depende muchísimo
#   meta:   fuerza general estimada, de 0 a 1
#   evo:    bonus extra si tienes la evolución desbloqueada y la usas en un espacio de evolución
#   champion: true si es campeón (máximo 1 por mazo)
#
# IMPORTANTE: `meta`, `sens` y `evo` son ESTIMACIONES INICIALES para que el prototipo funcione.
# Ajústalas a tu criterio o según el meta de la temporada.
